# Default harness configuration for HarnessEvolver
# This is the versioned, serializable state of all harness components.
# The meta-agent updates this file when it edits components.

version: "0.1.0"
created_at: "2026-05-11T00:00:00"
updated_at: "2026-05-11T00:00:00"

model: "claude-sonnet-4-6"
# Compatibility/progress reference only. 0 means no turn-count reference;
# Worker loops do not stop on turn count.
max_turns_audit: 0
# Legacy single model-provider request timeout reference. This is not a
# master, sub-agent, Codex update, diagnostic/context, or Worker loop deadline.
timeout_seconds: 1800
thinking_budget: 16000
reasoning:
  effort: xhigh
  max_tokens: 16000
  exclude: false

prompts:
  worker_policy:
    name: "worker_policy"
    path: "crates/hl-worker-core/src/main.rs"
