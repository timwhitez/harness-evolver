goal:
  objective: "Reduce handwritten Worker guard surface without regressing the fixed TerminalBench safety set"
  status: active
  score_target: 0.65
  # Token budget is a per-HL-iteration window by default. Cumulative token
  # usage is still recorded for audit, but one expensive iteration must not
  # prevent the next requested improvement round from starting.
  token_budget: 10000000
  token_budget_scope: iteration  # iteration | campaign
  # Reporting only. Goal wall-time budgets are recorded for audit but do not
  # stop master/sub-agent loops.
  wall_time_budget_seconds: null
  submit_when_reached: false

submit:
  enabled: false
  trigger_score: 0.80
  min_tasks_evaluated: 89
  min_attempts_per_task: 5
  require_full_regression: true
  require_clean_git: true
  require_no_uncommitted_harness_diff: true
  require_integrity_scan: true
  require_atif_trajectory: true
  harbor_upload: true
  visibility: private
  share_orgs:
    - TimWhite-AGI
  share_users:
    - timwhitez
  share_yes: true
  stop_after_submit_attempt: true
  once_per_campaign: true
